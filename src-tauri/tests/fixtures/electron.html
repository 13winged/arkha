<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Archotic UIA</title>
</head>
<body>
  <!--
    Страница для гейта UI Automation.

    Нужна потому, что проверять надо на настоящей программе, которая
    рисует интерфейс сама. Chrome не создаёт дочерних окон Win32 под
    кнопку, поэтому обычный поиск по окнам её не найдёт — а дерево
    доступности найдёт, потому что кнопка здесь настоящая, с текстом.

    Проверяется не «элемент найден», а «после нажатия заголовок
    вкладки сменился»: заголовок видно и человеку, и программно.
  -->
  <h1>Проверка доступа</h1>
  <button id="кнопка" onclick="document.title = 'Archotic UIA нажата'">
    Нажми Archotic
  </button>
  <p id="счётчик">нажатий: 0</p>
  <script>
    let нажатий = 0;
    document.getElementById('кнопка').addEventListener('click', () => {
      нажатий += 1;
      document.getElementById('счётчик').textContent = 'нажатий: ' + нажатий;
    });
  </script>
</body>
</html>
