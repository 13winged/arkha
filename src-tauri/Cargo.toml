[package]
name = "arkha"
version = "1.3.0-13"
description = "Локальный ИИ-секретарь для Windows"
authors = ["ArkHa"]
edition = "2024"
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arkha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Лицензии проверены в S2, см. docs/09-лицензии.md.
# В reqwest 0.13 фичи переименованы: rustls вместо rustls-tls,
# корневые сертификаты идут вместе с rustls.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "blocking",
    "rustls",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
futures-util = "0.3"
sha2 = "0.11"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# S10: определение речи в потоке (VAD). Silero VAD — 2.22 МиБ ONNX,
# MIT, snakers4/silero-vad. candle — MIT OR Apache-2.0 (проверено
# по манифесту и LICENSE в репозитории huggingface/candle 14.10.2026,
# docs/09-лицензии.md, раздел «VAD»).
# Почему ONNX, а не Silero через PyTorch: приложение должно
# собираться в один установщик без Python на машине пользователя.
candle-onnx = { version = "0.11", default-features = false }

# Тензоры и устройства. Прямая зависимость, а не через candle-onnx:
# Tensor нужен нам в коде, и объявлять чужой транзитивный крейт
# своей прямой зависимостью нельзя — версия обядина совпадать.
candle-core = { version = "0.11", default-features = false }

# Разбор ONNX-файла. prost — тем, чем сам candle-onnx читает
# ModelProto, и его версия обязана совпадать с той, на которой
# собран candle-onnx: 0.11 тянетprost ^0.14. Лицензия Apache-2.0.
prost = "0.14"

# Распаковка движка с картой: приложение само разбирает архив
# релиза llama.cpp. Лицензия MIT (zip-rs/zip2), проверено 15.10.2026.
# Крейт и так уже в дереве через candle, поэтому прямой вызов
# ничего не добавляет ни ко времени сборки, ни к размеру: из
# контрольной сборки известно, что candle в установщик не попадает.
zip = "8"

# Гейту нужен HWND, а его тип определён в крейте windows.
# Дублировать его ради теста нельзя: два разных определения одного
# дескриптора не совпадут, и компилятор об этом не предупредит.
# Тот же крейк, те же лицензии — см. docs/09-лицензии.md.
# Windows-only krest: moved to platform-specific section

rubato = "5.0.1"
rayon = "1.12.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
audioadapter-buffers = "5"
thiserror = "2"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
sysinfo = "0.32"
lopdf = "0.34"
docx-rs = "0.4"

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Security_Cryptography",
    "Win32_UI_Accessibility",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.15"
libc = "0.2"
x11 = "2.21"
zbus = "4"

[dev-dependencies]
criterion = "0.8.2"
