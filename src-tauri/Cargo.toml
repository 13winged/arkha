[package]
name = "arsha"
version = "0.1.0"
description = "Локальный ИИ-секретарь для Windows"
authors = ["Arsha"]
edition = "2024"
# Все зависимости проверяются по лицензии до добавления.
# Список и результаты проверки: docs/09-лицензии.md
license = "Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arsha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Лицензия MIT OR Apache-2.0, проверено в S0.
# docs/09-лицензии.md, раздел «UI Automation из Rust».
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # S8: чтение окон, фокус, ввод с клавиатуры и мыши.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    # S8: дерево доступности. Нужно для приложений, которые рисуют
    # интерфейс сами: Chrome, Telegram, VS Code. У них нет дочерних
    # окон Win32, поэтому поиск по EnumChildWindows их не находит, а
    # UI Automation отдаёт их элементы. Нажатие идёт через
    # InvokePattern, то есть без перехвата фокуса и без координат.
    "Win32_UI_Accessibility",
] }

# Лицензии проверены в S2, см. docs/09-лицензии.md.
# В reqwest 0.13 фичи переименованы: rustls вместо rustls-tls,
# корневые сертификаты идут вместе с rustls.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "blocking",
    "rustls",
    "charset",
    "http2",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net"] }
futures-util = "0.3"
sha2 = "0.11"

# Гейту нужен `HWND`, а его тип определён в крейте `windows`.
# Дублировать его ради теста нельзя: два разных определения одного
# дескриптора не совпадут, и компилятор об этом не предупредит.
# Тот же крейт, те же лицензии — см. docs/09-лицензии.md.
[dev-dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
