# CI workflow for ArkHa
# Кроссплатформенная проверка: Windows + Linux (Debian-based, X11)
#
# Plan phases 1-3 completed:
# - Platform dependency abstraction in Cargo.toml
# - record_linux.rs module (ALSA/PipeWire via cpal)
# - hotkey_linux.rs module (X11 XGrabKey)
#
# Phase 5: CI matrix Windows + Ubuntu

name: ArkHa CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ArkHa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Матрица сборки: Windows + Linux
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      # Кэширование и настройка окружения
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Windows-specific steps
      - name: Only on Windows
        if: matrix.os == 'windows-latest'
        run: |
          # Setup PowerShell path
          Write-Host "Running on Windows"

      # Linux-specific steps
      - name: Only on Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install system dependencies for ALSA/PipeWire
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev \
            libwebkit2gtk-4.0-dev

      # Install Node.js (for Tauri build)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tauri dependencies
        if: matrix.os == 'windows-latest'
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo install cargo-denial 2>/dev/null || true

      # Protocol buffer generator
      - name: Fetch protoc
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: ./scripts/fetch-protoc.ps1

      - name: Fetch llama.cpp
        shell: powershell
        if: matrix.os == 'windows-latest'
        run: ./scripts/fetch-llama.ps1

      # Linux: fallback to cross-platform llama build script
      - name: Fetch llama (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Try PowerShell first, fall back to bash
          if [ -f scripts/fetch-llama.ps1 ]; then
            pwsh -File scripts/fetch-llama.ps1 || true
          fi
          # Or use alternative method
          cargo llama 2>/dev/null || echo "Using alternative method"

      # Build type check
      - name: Check cargo
        run: cargo check --manifest-path src-tauri/Cargo.toml

      # Run tests
      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      # i18n check
      - name: i18n check
        run: node scripts/i18n-check.cjs