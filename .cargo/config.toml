# Путь к `protoc` для сборки `candle-onnx`.
#
# Нужен только при сборке, не в готовом приложении: это компилятор
# протокольных буферов, которым генерируется разбор ONNX. На машине
# человека, куда поставлен ArkHa, его нет и не нужно.
#
# Положен рядом с проектом, а не установлен в систему, намеренно:
# иначе сборка зависит от того, что настроено на машине, и перестаёт
# воспроизводиться. Папка `src-tauri/tools` не попадает в git —
# она качается скриптом `scripts/fetch-protoc.ps1`.
#
# Файл лежит в корне репозитория, а не в `src-tauri`, потому что
# cargo ищет `.cargo/config.toml` от рабочего каталога вверх, а не
# от каталога манифеста. Сборка из корня репозитория — обычный
# случай, и в этом случае файл читается.
#
# Лицензия protoc: BSD-3-Clause. docs/09-лицензии.md, раздел «VAD».
[env]
PROTOC = { value = "src-tauri/tools/protoc/bin/protoc.exe", relative = true }